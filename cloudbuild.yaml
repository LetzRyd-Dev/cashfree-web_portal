steps:
  # Step 1: Build the Docker image for Production
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/cloud-run-source-deploy/letzryd-portal:latest'
      - '.'

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/cloud-run-source-deploy/letzryd-portal:latest'

  # Step 3: Deploy to Cloud Run prod service (letzryd-portal)
  # Preserves all existing prod environment variables (DB, Cashfree simulation credentials)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'letzryd-portal'
      - '--image'
      - 'asia-south1-docker.pkg.dev/letzryd-dev-test/cloud-run-source-deploy/letzryd-portal:latest'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--quiet'

images:
  - 'asia-south1-docker.pkg.dev/letzryd-dev-test/cloud-run-source-deploy/letzryd-portal:latest'

options:
  logging: CLOUD_LOGGING_ONLY

timeout: '1200s'
