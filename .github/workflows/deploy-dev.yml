name: Deploy Dev Cashfree Payment Portal to GCP Cloud Run

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    name: Deploy to Cloud Run (dev-cashfree-web-portal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build and Push Docker Image
        run: |
          IMAGE_URI="asia-south1-docker.pkg.dev/letzryd-dev-test/cashfree-web-portal/dev-app:${{ github.sha }}"
          LATEST_URI="asia-south1-docker.pkg.dev/letzryd-dev-test/cashfree-web-portal/dev-app:latest"
          docker build -t $IMAGE_URI -t $LATEST_URI .
          docker push $IMAGE_URI
          docker push $LATEST_URI

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy dev-cashfree-web-portal \
            --image asia-south1-docker.pkg.dev/letzryd-dev-test/cashfree-web-portal/dev-app:${{ github.sha }} \
            --region asia-south1 \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars="DB_HOST=34.93.205.164,DB_PORT=5432,DB_NAME=letzryd_dev,DB_USER=letzryd_dev_user,DB_PASS=LetzRydDevPass2026!"
